id: periodic_revenue_change
kind: task
status: draft

meaning: >-
  Find revenue for a requested periodic-reporting interval and compare it with a requested base
  interval using evidence-bound, semantically comparable values.

depends_on:
  company: semantics/entities/company.yaml
  reporting_scope: semantics/dimensions/reporting_scope.yaml
  reporting_period: semantics/dimensions/reporting_period.yaml
  revenue: semantics/concepts/revenue.yaml
  change: semantics/operations/change.yaml

required_bindings:
  - company
  - reporting_scope
  - current_period
  - previous_period
  - metric=revenue
  - unit

claim_plan:
  current_revenue:
    kind: direct
    semantics: semantics/concepts/revenue.yaml
    binds:
      period: current_period
  previous_revenue:
    kind: direct
    semantics: semantics/concepts/revenue.yaml
    binds:
      period: previous_period
  change_amount:
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.amount
    depends_on:
      - current_revenue
      - previous_revenue
  change_rate:
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.rate
    depends_on:
      - current_revenue
      - previous_revenue
  direction:
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.direction
    depends_on:
      - change_amount

retrieval_contract:
  - Resolve company identity through company master data.
  - Select periodic disclosures covering the requested periods.
  - Locate the statement matching the requested reporting scope.
  - Locate the revenue fact and bind its period, unit, scope, and document version.
  - Prefer comparative columns in one statement when they directly provide both requested periods.

answerability:
  answerable_when:
    - Both direct revenue claims have complete evidence context.
    - All change preconditions hold.
  partially_answerable_when:
    - Current revenue is supported but a requested comparison output cannot be derived.
  unanswerable_when:
    - Current revenue is missing or ambiguous.
    - Scope or period cannot be resolved from the allowed corpus.
  response_rule: State which required binding or evidence is missing; do not infer the missing value.

gold_case_axes:
  reporting_scope:
    - consolidated
    - separate
  period_pair:
    - year_over_year_quarter
    - sequential_quarter
    - year_over_year_annual
  evidence_topology:
    - one_statement_comparative_columns
    - two_disclosures
  document_version:
    - original
    - corrected
  answerability:
    - answerable
    - partially_answerable
    - unanswerable
  unit_shape:
    - same_reported_unit
    - explicit_unit_conversion

case_addition_rule: >-
  Add a gold case for a combination that introduces a distinct semantic or retrieval failure. Do
  not add one solely because the company changed.
