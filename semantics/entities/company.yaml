id: company
kind: entity
status: draft

meaning: >-
  The legal reporting entity identified in the company master and in a disclosure. A display name
  or alias is not itself identity.

identity:
  canonical_key: corp_code
  attributes:
    - sector_no
    - stock_code
    - corp_name
    - listed_name
    - corp_eng_name
  rules:
    - Resolve query names to one corp_code before document retrieval.
    - Use corp_code, not a name string, to join company master data and disclosures.
    - Treat a name mismatch or multiple matching corp_codes as ambiguity.

where_to_find:
  company_master:
    path: corpus/universe.csv
    key_column: corp_code
  periodic_disclosure:
    xml_element: COMPANY-NAME
    identity_attribute: AREGCIK
