id: reporting_period
kind: dimension
status: reviewed_for_case

meaning: >-
  The interval over which a flow fact was accumulated. It is different from the filing date and
  from a point-in-time balance-sheet date.

attributes:
  - fiscal_year
  - fiscal_quarter
  - start_date
  - end_date
  - duration

where_to_find:
  report_cover:
    period_start:
      xml_attribute: AUNITVALUE
      xml_selector: TU[AUNIT=PERIODFROM]
    period_end:
      xml_attribute: AUNITVALUE
      xml_selector: TU[AUNIT=PERIODTO]
  financial_statement:
    - statement period caption
    - column header
    - fact ACONTEXT

comparison_rules:
  - Compare flow facts with the same duration and fiscal position unless the query asks otherwise.
  - For a year-over-year Q1 comparison, both values must cover their respective fiscal Q1.
  - Never interpret the filing date as the revenue period.
