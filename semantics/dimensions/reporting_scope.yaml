id: reporting_scope
kind: dimension
status: reviewed_for_case

meaning: >-
  The boundary of entities included in a reported financial value. The same metric and period are
  not comparable when their reporting scopes differ.

values:
  consolidated:
    meaning: The parent and its controlled entities are presented as one reporting group.
    disclosure_labels:
      - 연결
      - 연결기준
    evidence_rules:
      - The statement title must identify a consolidated statement.
      - The fact context must identify ConsolidatedMember when that XBRL axis is present.
  separate:
    meaning: The reporting company is presented without consolidating controlled entities.
    disclosure_labels:
      - 별도
      - 별도기준
    evidence_rules:
      - Do not use a consolidated fact for a separate-scope query.

comparison_rules:
  - Current and previous values must have the same reporting scope.
  - If the query specifies a scope, a value with unknown scope is not acceptable evidence.
