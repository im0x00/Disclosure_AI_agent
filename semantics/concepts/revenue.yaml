id: revenue
kind: disclosed_financial_metric
status: reviewed_for_case

domain_meaning: >-
  Income arising from an entity's ordinary activities during a reporting period, before deducting
  the expenses incurred to earn it. It is a period flow, not a point-in-time balance. Revenue
  recognition and cash collection need not occur at the same time.

operational_meaning_for_disclosure: >-
  The value reported as revenue in the financial statement after company, reporting scope,
  reporting period, unit, and document version have all been bound. A matching word without these
  dimensions is not yet a revenue fact.

fact_identity:
  key:
    - company
    - concept
    - reporting_scope
    - reporting_period
    - unit
    - document_version

labels:
  accepted_for_this_case:
    - 매출액
  xbrl_codes_reviewed_for_this_case:
    - ifrs-full_Revenue
  not_equivalent:
    - 매출원가
    - 영업이익
    - 당기순이익
    - 현금유입

where_to_find:
  disclosure_family: periodic
  preferred_statement:
    - consolidated statement of comprehensive income
    - income statement
  row_identification:
    xbrl_attribute: ACODE
    xbrl_value: ifrs-full_Revenue
    visible_label: 매출액
  required_context:
    - company identity
    - statement scope
    - period column
    - unit caption
    - fact value
  rejection_rules:
    - Reject a value taken only from narrative text when the query asks for the financial-statement value.
    - Reject a value whose scope, period, or unit cannot be bound.
    - Do not add values from different periods or scopes to manufacture revenue.

normalization:
  preserve_reported_value: true
  convert_parentheses_to_negative: true
  unit_conversion:
    allowed_only_when_explicit: true
