[project]
name = "DisclosureAiAgent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
