id: periodic_revenue_change.hyundai_steel.2025_q1_vs_2024_q1.consolidated
task_semantics: semantics/tasks/periodic_revenue_change.yaml

company:
  semantics: semantics/entities/company.yaml
  corp_code: "00145880"
  stock_code: "004020"
  canonical_name: 현대제철
  aliases:
    - 현대제철
    - 현대제철 주식회사
    - hyundai_steel

query: >-
  현대제철의 2025년 1분기 연결기준 매출액은 얼마인가?
  2024년 1분기와 비교한 증감액과 증감률도 알려줘.

bindings:
  metric:
    semantics: semantics/concepts/revenue.yaml
    value: revenue
  reporting_scope:
    semantics: semantics/dimensions/reporting_scope.yaml
    value: consolidated
  current_period:
    semantics: semantics/dimensions/reporting_period.yaml
    fiscal_year: 2025
    fiscal_quarter: 1
    start_date: 2025-01-01
    end_date: 2025-03-31
  previous_period:
    semantics: semantics/dimensions/reporting_period.yaml
    fiscal_year: 2024
    fiscal_quarter: 1
    start_date: 2024-01-01
    end_date: 2024-03-31
  unit: KRW

combination:
  period_pair: year_over_year_quarter
  evidence_topology: one_statement_comparative_columns
  document_version: original
  answerability: answerable
  unit_shape: same_reported_unit

answerability: answerable

claims:
  - id: current_revenue
    kind: direct
    semantics: semantics/concepts/revenue.yaml
    expected: 5563465036922
    unit: KRW
    dimensions:
      company_corp_code: "00145880"
      reporting_scope: consolidated
      period_start: 2025-01-01
      period_end: 2025-03-31
    evidence:
      document_id: "20250515002501"
      path: corpus/raw/periodic/현대제철/20250515002501_quarter_2025_03/20250515002501.xml
      document_name: 분기보고서
      company_element:
        name: COMPANY-NAME
        AREGCIK: "00145880"
        text: 현대제철 주식회사
      statement_title: 연결 포괄손익계산서
      period_caption: 제 61 기 1분기 2025.01.01 부터 2025.03.31 까지
      column_header: 제 61 기 1분기 / 3개월
      unit_caption: "(단위 : 원)"
      fact_element:
        name: TE
        ACODE: ifrs-full_Revenue
        ACONTEXT: CFY2025dFQQ_ifrs-full_ConsolidatedAndSeparateFinancialStatementsAxis_ifrs-full_ConsolidatedMember
        text: "5,563,465,036,922"

  - id: previous_revenue
    kind: direct
    semantics: semantics/concepts/revenue.yaml
    expected: 5947782420213
    unit: KRW
    dimensions:
      company_corp_code: "00145880"
      reporting_scope: consolidated
      period_start: 2024-01-01
      period_end: 2024-03-31
    evidence:
      document_id: "20250515002501"
      path: corpus/raw/periodic/현대제철/20250515002501_quarter_2025_03/20250515002501.xml
      document_name: 분기보고서
      company_element:
        name: COMPANY-NAME
        AREGCIK: "00145880"
        text: 현대제철 주식회사
      statement_title: 연결 포괄손익계산서
      period_caption: 제 60 기 1분기 2024.01.01 부터 2024.03.31 까지
      column_header: 제 60 기 1분기 / 3개월
      unit_caption: "(단위 : 원)"
      fact_element:
        name: TE
        ACODE: ifrs-full_Revenue
        ACONTEXT: PFY2024dFQQ_ifrs-full_ConsolidatedAndSeparateFinancialStatementsAxis_ifrs-full_ConsolidatedMember
        text: "5,947,782,420,213"

  - id: change_amount
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.amount
    expected: -384317383291
    unit: KRW
    derived_from:
      - current_revenue
      - previous_revenue
    formula: current_revenue - previous_revenue

  - id: change_rate
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.rate
    expected: -6.46
    unit: percent
    tolerance: 0.01
    derived_from:
      - current_revenue
      - previous_revenue
    formula: (current_revenue - previous_revenue) / previous_revenue * 100
    unrounded_value: -6.461523911583117

  - id: direction
    kind: derived
    semantics: semantics/operations/change.yaml#outputs.direction
    expected: decrease
    derived_from:
      - change_amount
    rule: change_amount < 0

required_answer_parts:
  - current_revenue
  - previous_revenue
  - change_amount
  - change_rate
  - direction
  - source_reference

expected_answer: >-
  현대제철의 2025년 1분기 연결기준 매출액은 5,563,465,036,922원입니다.
  2024년 1분기 5,947,782,420,213원보다 384,317,383,291원, 약 6.46% 감소했습니다.
